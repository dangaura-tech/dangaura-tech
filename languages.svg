<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="470" height="240" viewBox="0 0 470 240" role="img" aria-label="Most used languages">
<style>
.title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6e8ff; }
.label { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9cdf0; }
.value { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9cdf0; }
.muted { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7a81ab; }
.big { font: 700 26px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b7cff; }
.fade { opacity: 0; animation: fadein .6s ease-in-out forwards; }
@keyframes fadein { to { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" rx="10" width="469" height="239" fill="#0f1326" stroke="#262b4d"/>
<text x="25" y="35" class="title">Most used languages</text>
<clipPath id="r"><rect x="25" y="60" width="420" height="10" rx="5"/></clipPath><g clip-path="url(#r)"><rect x="25.0" y="60" width="405.4" height="10" fill="#3572A5"/><rect x="430.4" y="60" width="4.9" height="10" fill="#89e051"/><rect x="435.3" y="60" width="4.9" height="10" fill="#AA6746"/><rect x="440.2" y="60" width="4.8" height="10" fill="#3178c6"/></g><g class="fade" style="animation-delay:200ms"><circle cx="31" cy="107" r="6" fill="#3572A5"/><text x="45" y="112" class="label">Python</text><text x="215" y="112" text-anchor="end" class="muted">96.5%</text></g>
<g class="fade" style="animation-delay:320ms"><circle cx="246" cy="107" r="6" fill="#89e051"/><text x="260" y="112" class="label">Shell</text><text x="430" y="112" text-anchor="end" class="muted">1.2%</text></g>
<g class="fade" style="animation-delay:440ms"><circle cx="31" cy="147" r="6" fill="#AA6746"/><text x="45" y="152" class="label">Solidity</text><text x="215" y="152" text-anchor="end" class="muted">1.2%</text></g>
<g class="fade" style="animation-delay:560ms"><circle cx="246" cy="147" r="6" fill="#3178c6"/><text x="260" y="152" class="label">TypeScript</text><text x="430" y="152" text-anchor="end" class="muted">1.1%</text></g>
