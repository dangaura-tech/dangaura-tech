name: Generate profile cards

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_cards.py"
      - "scripts/svgart.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py --user "${{ github.repository_owner }}" --out dist
      - name: Publish to the cards branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
